      - name: Extract PWA ZIP
        run: |
          set -euo pipefail

          ZIP_FILE="ke-pwa-final-ghpages.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d .

          echo "Extraction complete."
          find . -maxdepth 3 -type f \
            ! -path './.git/*' \
            ! -path './.github/*' | head -100
