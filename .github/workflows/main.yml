name: Extract PWA ZIP

on:
  push:
    paths:
      - '**.zip'
      - '**/*.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Find and extract ZIP
        run: |
          ZIP_FILE=$(find . -type f -name '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d ./extracted

          echo "Extracted files:"
          find ./extracted -maxdepth 3 -type f | head -100

      - name: Save extracted files
        run: |
          cp -a extracted/. .
          rm -rf extracted

      - name: Commit extracted PWA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || \
            git commit -m "Extract PWA from uploaded ZIP"

          git push
